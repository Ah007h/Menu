<style>
:root{--bg:#f3f5f7;--card:#fff;--navy:#1f4a76;--ink:#17314f;--mut:#6b7f95;--line:#dbe3ea;--soft:#e4ecf4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1c2b;--card:#17283b;--navy:#7fb0e0;--ink:#e8eff6;--mut:#9db0c4;--line:#27405a;--soft:#1f3550}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;min-height:100vh}
body.lock{overflow:hidden}
.hero{background:linear-gradient(160deg,#1f4a76,#2c6094);color:#fff;text-align:center;padding:calc(30px + env(safe-area-inset-top,0px)) 16px 64px;position:relative}
.hero svg{position:absolute;bottom:-1px;left:0;width:100%;height:44px;display:block}
.hero svg path{fill:var(--bg)}
.logo{font-size:52px;font-weight:800;line-height:1.3;margin-bottom:8px}
.sub{letter-spacing:.4em;font-size:12px;opacity:.85;margin-top:2px}
.rule{width:70px;height:2px;background:#fff;opacity:.6;margin:14px auto}
.tag{font-size:18px;font-weight:600}
.tag2{font-size:11px;letter-spacing:.35em;opacity:.8;margin-top:6px}
.lang{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));inset-inline-end:14px;border:1px solid #fff;color:#fff;background:rgba(255,255,255,.12);border-radius:20px;padding:6px 14px;font-weight:600;cursor:pointer;font-family:inherit}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 24px}
.ttl{display:flex;align-items:center;gap:12px;color:var(--navy);font-weight:700;margin:6px 0 4px}
.ttl:before,.ttl:after{content:"";flex:1;height:1px;background:var(--line)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.cat{background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--navy);border-radius:18px;padding:0;cursor:pointer;overflow:hidden;text-align:center;color:var(--ink);font:inherit;box-shadow:0 4px 14px rgba(31,74,118,.08);transition:transform .15s}
.cat:active{transform:scale(.97)}
.ph{aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:44px;background:var(--soft);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cat b{display:block;padding:10px 6px 2px;color:var(--navy);font-size:15px}
.cat small{display:block;padding:0 6px 12px;color:var(--mut);font-size:12px}
.top{display:flex;align-items:center;gap:10px;padding:20px 0 6px}
.back{border:0;background:var(--navy);color:var(--bg);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
html[dir=rtl] .back{transform:scaleX(-1)}
h2{margin:0;font-size:22px;color:var(--navy)}
.banner{height:140px;border-radius:18px;overflow:hidden;margin:6px 0 4px;border-bottom:4px solid var(--navy)}
.banner img{width:100%;height:100%;object-fit:cover;display:block}
.item{display:flex;align-items:stretch;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-top:12px;box-shadow:0 3px 10px rgba(31,74,118,.06)}
.thumb{width:96px;height:96px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:38px;overflow:hidden;flex:none;cursor:zoom-in;border:0;padding:0}
.thumb.noz{cursor:default}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.nm{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:8px}
.nm b{display:block;font-size:16px;color:var(--navy)}
.nm span{font-size:12px;color:var(--mut);margin-top:2px}
.nm p{margin:6px 0 8px;font-size:13px;line-height:1.5;color:var(--ink);opacity:.85}
.vp{display:flex;gap:6px;flex-wrap:wrap}.pv{background:var(--navy);color:var(--bg);border-radius:8px;padding:4px 8px;text-align:center;min-width:56px}.pv small{display:block;font-size:10px;opacity:.85;line-height:1.2}.pv b{font-size:14px;color:inherit}.note{font-size:13px;color:var(--mut);margin:6px 2px 0}
.pr{align-self:flex-start;background:var(--navy);color:var(--bg);font-weight:700;border-radius:8px;padding:5px 12px;font-size:14px;white-space:nowrap}
footer{background:#1f4a76;color:#fff;text-align:center;padding:34px 16px calc(24px + env(safe-area-inset-bottom,0px));position:relative;margin-top:40px;font-size:13px;line-height:1.9}
footer svg{position:absolute;top:-1px;left:0;width:100%;height:30px;display:block;transform:rotate(180deg)}
footer svg path{fill:var(--bg)}
footer .l{font-size:30px;font-weight:800}
footer small{opacity:.8}
/* welcome */
#welcome{position:fixed;inset:0;z-index:50;background:linear-gradient(165deg,#173d63,#2c6094);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .45s,visibility .45s}
#welcome.hide{opacity:0;visibility:hidden}
.wbox{text-align:center;max-width:380px;width:100%;animation:up .7s ease both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.wbox .logo{font-size:84px;line-height:1.4;margin-bottom:14px}
.wbox .sub{font-size:14px;margin-top:0}
.wbox .wel{font-size:22px;font-weight:700;margin-top:6px}
.wbox .wel2{font-size:15px;opacity:.85;margin-top:2px;letter-spacing:.08em}
.pick{opacity:.85;font-size:13px;margin:26px 0 12px}
.lbtn{display:block;width:100%;border:0;border-radius:16px;padding:16px;margin-top:12px;font-size:20px;font-weight:700;cursor:pointer;font-family:inherit;background:#fff;color:#1f4a76;box-shadow:0 8px 24px rgba(0,0,0,.2);transition:transform .15s}
.lbtn:active{transform:scale(.97)}
.lbtn.o{background:transparent;color:#fff;border:2px solid #fff}
.wbox .tg{margin-top:26px;font-size:12px;letter-spacing:.3em;opacity:.7}
/* lightbox */
#lb2{position:fixed;inset:0;z-index:60;background:rgba(8,18,30,.92);display:none;align-items:center;justify-content:center;flex-direction:column;padding:20px;gap:14px}
#lb2.on{display:flex}
#lb2 img{max-width:100%;max-height:75vh;border-radius:16px}
#lb2 div{color:#fff;font-weight:700;font-size:18px;text-align:center}
</style>

function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-")}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}
function catImg(c){return '<img alt="'+esc(c.en)+'" loading="lazy" src="images/categories/'+c.id+'.jpg" onerror="this.parentNode.textContent=\''+c.e+'\'">'}
function render(){
 var t=T[L],h="";
 document.documentElement.lang=L;document.documentElement.dir=L=="ar"?"rtl":"ltr";
 document.getElementById("lb").textContent=t.lb;document.getElementById("ft").textContent=t.ft;
 var tt=document.getElementById("tt");tt.textContent=cur===null?t.tt:"";tt.style.display=cur===null?"flex":"none";
 if(cur===null){
  h='<div class="grid">'+C.map(function(c,n){return '<button class="cat" onclick="openCat('+n+')"><div class="ph">'+catImg(c)+'</div><b>'+c[L]+'</b><small>'+c.i.length+' '+t.items+'</small></button>'}).join("")+'</div>';
 }else{
  var c=C[cur];
  h='<div class="top"><button class="back" onclick="openCat(null)">\u2190</button><h2>'+c[L]+'</h2></div><div class="banner">'+catImg(c)+'</div>'+(c.v?'<div class="note">'+(L=="ar"?"اختر نوع المشروب الغازي":"Choose your base")+'</div>':"")+c.i.map(function(x){
   var k=c.id+"-"+slug(x[6]||x[0]),has=ITEMPH.indexOf(k)>-1,o=L=="ar"?x[1]:x[0],s=L=="ar"?x[0]:x[1],d=L=="ar"?x[5]:x[4];
   var th=has?'<button class="thumb" onclick="zoom(\''+k+'\','+cur+',\''+esc(x[0]).replace(/'/g,"\\'")+'\')"><img alt="'+esc(o)+'" loading="lazy" src="images/items/'+k+'.jpg"></button>':'<div class="thumb noz">'+x[3]+'</div>';
   return '<div class="item">'+th+'<div class="nm"><b>'+o+'</b><span>'+s+'</span>'+priceHTML(x,c,t)+'</div></div>'}).join("");
 }
 document.getElementById("app").innerHTML=h;
}
